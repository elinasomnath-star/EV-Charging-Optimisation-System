# EVOCS - EV Optimal Charging Scheduler
# NH-44 Highway Corridor Configuration
# Bangalore → Hosur → Krishnagiri → Dharmapuri → Salem

simulation:
  timescale: 15                # minutes per step
  simulation_length: 96        # steps per episode (24 hours)
  n_episodes_train: 2000
  n_episodes_eval: 100
  random_seed: 42

stations:
  - id: 1
    name: "Anekal_Junction"
    location_km: 28
    operator: "Bolt.Earth"
    n_chargers: 4
    charger_kw: 50.0
    transformer_kva: 250
    charger_type: "DC_CCS2"

  - id: 2
    name: "Hosur_TataPower"
    location_km: 48
    operator: "TataPower"
    n_chargers: 6
    charger_kw: 50.0
    transformer_kva: 300
    charger_type: "DC_CCS2"

  - id: 3
    name: "Krishnagiri_Statiq"
    location_km: 95
    operator: "Statiq"
    n_chargers: 3
    charger_kw: 50.0
    transformer_kva: 160
    charger_type: "DC_CCS2"

  - id: 4
    name: "Dharmapuri_TataPower"
    location_km: 140
    operator: "TataPower"
    n_chargers: 4
    charger_kw: 50.0
    transformer_kva: 250
    charger_type: "DC_CCS2"

  - id: 5
    name: "Salem_Bolt"
    location_km: 200
    operator: "Bolt.Earth"
    n_chargers: 8
    charger_kw: 50.0
    transformer_kva: 400
    charger_type: "DC_CCS2"

ev_specs:
  - name: "Tata_Nexon_EV"
    battery_kwh: 40.5
    max_charge_kw: 7.2
    efficiency: 0.92

  - name: "Tata_Tiago_EV"
    battery_kwh: 24.0
    max_charge_kw: 3.3
    efficiency: 0.91

  - name: "MG_ZS_EV"
    battery_kwh: 50.3
    max_charge_kw: 7.4
    efficiency: 0.93

  - name: "Ola_S1_Pro"
    battery_kwh: 4.0
    max_charge_kw: 1.5
    efficiency: 0.90

arrival:
  peak_hours: [7, 8, 9, 17, 18, 19, 20]  # highway peak traffic
  base_arrival_rate: 1                     # EVs per hour off-peak
  peak_arrival_rate: 3                     # EVs per hour peak
  min_soc_on_arrival: 0.15
  max_soc_on_arrival: 0.65
  min_stay_hours: 1.0
  max_stay_hours: 3.0
  target_soc: 0.80

dqn:
  learning_rate: 0.0005
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  batch_size: 64
  memory_size: 20000
  target_update_freq: 200
  hidden_layers: [128, 64]
